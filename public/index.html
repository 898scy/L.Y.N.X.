<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDSTORMS NXT Web Studio</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Blockly -->
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <!-- Blockly Python Generator -->
    <script src="https://unpkg.com/blockly/python_compressed.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #F4F5F9; }
        
        /* SPIKE風のUIスタイル */
        .scratch-header { background-color: #FFDE00; color: #111; }
        .blockly-container { 
            position: relative; width: 100%; height: 100%; min-height: 500px; 
            border-radius: 0.5rem; overflow: hidden; border: 2px solid #E2E8F0; background: #fff;
        }
        #blocklyDiv { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* 右パネルのカードスタイル */
        .panel-card { background: white; border-radius: 0.5rem; border: 1px solid #E2E8F0; margin-bottom: 1rem; overflow: hidden; }
        .panel-header { background: #F8FAFC; padding: 0.5rem 1rem; border-bottom: 1px solid #E2E8F0; font-weight: bold; color: #475569; font-size: 0.875rem; }
        .panel-body { padding: 1rem; }

        /* スクロールバー */
        #codePreview, #logConsole { scrollbar-width: thin; }
        #codePreview::-webkit-scrollbar, #logConsole::-webkit-scrollbar { width: 6px; }
        #codePreview::-webkit-scrollbar-thumb, #logConsole::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Header (SPIKE Yellow) -->
    <header class="scratch-header p-3 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center space-x-3">
            <svg class="w-8 h-8 text-gray-800" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <h1 class="text-xl font-bold tracking-wide">NXT/SPIKE Studio</h1>
            <span id="connectionStatus" class="ml-4 px-3 py-1 rounded-full text-xs font-bold bg-white text-gray-700 shadow-sm border border-gray-200">
                未接続
            </span>
        </div>
        <div class="flex space-x-3">
            <button id="btnConnect" class="bg-white hover:bg-gray-50 text-gray-800 px-4 py-2 rounded-full shadow-sm transition-colors text-sm font-bold border border-gray-300">
                USB 接続 (WebUSB)
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden p-2 gap-2">
        <!-- Left Panel: Blockly Workspace -->
        <div class="flex-[2] bg-white rounded-lg shadow-sm border border-gray-200 relative min-h-[500px]">
            <div id="blocklyDiv" class="absolute inset-0 w-full h-full rounded-lg overflow-hidden"></div>
        </div>

        <!-- Right Panel: Controls & Code -->
        <div class="flex-1 flex flex-col w-80 overflow-y-auto pr-1">
            <!-- Execution Controls -->
            <div class="panel-card shadow-sm mb-2">
                <div class="panel-header flex justify-between items-center bg-gray-50">
                    <span>コントロール</span>
                </div>
                <div class="panel-body flex flex-col space-y-2 bg-gray-50">
                    <div class="flex space-x-2">
                        <!-- みどりの旗 (テザーテスト) -->
                        <button id="btnTest" class="flex-1 bg-yellow-400 hover:bg-yellow-300 text-gray-900 p-3 rounded-lg shadow-sm border border-yellow-500 flex items-center justify-center space-x-2 font-bold transition-transform active:scale-95" title="PCからリアルタイム制御">
                            <svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm10.707 5.707l-3 3a1 1 0 01-1.414 0l-1.5-1.5a1 1 0 011.414-1.414L11 9.586l2.293-2.293a1 1 0 011.414 1.414z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
                            <span>ストリーミング実行</span>
                        </button>
                        <!-- 赤のストップサイン -->
                        <button id="btnStop" class="bg-red-500 hover:bg-red-400 text-white p-3 rounded-lg shadow-sm border border-red-600 flex items-center justify-center font-bold transition-transform active:scale-95" title="強制停止">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1zm4 0a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                    <!-- 本番デプロイ -->
                    <button id="btnDeploy" class="w-full bg-blue-500 hover:bg-blue-400 text-white px-4 py-2 rounded-lg shadow-sm border border-blue-600 transition-colors flex flex-col items-center justify-center space-y-1 font-bold text-sm relative group">
                        <div class="flex items-center space-x-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <span>本体へ書き込む (単体動作)</span>
                        </div>
                        <span class="text-xs text-blue-200 font-normal">※コンパイルサーバーが必要です</span>
                    </button>
                </div>
            </div>

            <!-- Code Preview (言語切り替え) -->
            <div class="panel-card shadow-sm flex-1 flex flex-col min-h-0 mb-2 relative">
                <div class="panel-header flex justify-between items-center bg-gray-50 border-b border-gray-200">
                    <span class="text-gray-700">生成コード <span class="text-xs text-red-500 font-normal ml-1">※編集不可 (ブロック反映のみ)</span></span>
                    <select id="langSelect" class="text-xs border border-gray-300 rounded px-2 py-1 bg-white outline-none text-gray-700 shadow-sm">
                        <option value="js">JavaScript (テザー用)</option>
                        <option value="py">Python (参考)</option>
                        <option value="c">C言語 / NXC (本体用)</option>
                    </select>
                </div>
                <div class="flex-1 p-0 relative bg-gray-900">
                    <!-- readonly属性を追加して編集不可にし、CSSでフォーカス枠を消す -->
                    <textarea id="codePreview" readonly class="absolute inset-0 w-full h-full p-3 m-0 bg-gray-900 text-green-400 text-xs font-mono overflow-y-auto resize-none outline-none border-none cursor-default"></textarea>
                </div>
            </div>

            <!-- Code Preview (言語切り替え) -->
            <div class="panel-card shadow-sm flex-1 flex flex-col min-h-0 mb-2">
                <div class="panel-header flex justify-between items-center">
                    <span>生成コード</span>
                    <select id="langSelect" class="text-xs border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                        <option value="js">JavaScript (テザー用)</option>
                        <option value="c">C言語 / NXC (本体用)</option>
                        <option value="py">Python (参考)</option>
                    </select>
                </div>
                <div class="flex-1 p-0 relative">
                    <pre id="codePreview" class="absolute inset-0 p-3 m-0 bg-gray-50 text-xs font-mono text-gray-700 overflow-y-auto whitespace-pre-wrap">コードがここに表示されます</pre>
                </div>
            </div>

            <!-- Sensor Monitor -->
            <div class="panel-card shadow-sm mb-2">
                <div class="panel-header flex justify-between items-center">
                    <span>センサーモニター</span>
                    <button id="btnPoll" class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 border border-blue-300 px-2 py-1 rounded font-bold">監視開始</button>
                </div>
                <div class="panel-body grid grid-cols-2 gap-2 text-sm bg-gray-50">
                    <div class="bg-white p-2 rounded border border-gray-200 flex justify-between shadow-inner">
                        <span class="text-gray-500 font-bold">1:</span>
                        <span id="sens1" class="font-mono text-blue-600 font-bold">0</span>
                    </div>
                    <div class="bg-white p-2 rounded border border-gray-200 flex justify-between shadow-inner">
                        <span class="text-gray-500 font-bold">2:</span>
                        <span id="sens2" class="font-mono text-blue-600 font-bold">0</span>
                    </div>
                    <div class="bg-white p-2 rounded border border-gray-200 flex justify-between shadow-inner">
                        <span class="text-gray-500 font-bold">3:</span>
                        <span id="sens3" class="font-mono text-blue-600 font-bold">0</span>
                    </div>
                    <div class="bg-white p-2 rounded border border-gray-200 flex justify-between shadow-inner">
                        <span class="text-gray-500 font-bold">4:</span>
                        <span id="sens4" class="font-mono text-blue-600 font-bold">0</span>
                    </div>
                </div>
            </div>

            <!-- Log Console -->
            <div class="panel-card shadow-sm h-32 flex flex-col">
                <div class="panel-header py-1">システムログ</div>
                <div id="logConsole" class="flex-1 bg-gray-900 text-green-400 p-2 overflow-y-auto text-xs font-mono whitespace-pre-wrap"></div>
            </div>
        </div>
    </main>

    <!-- Blockly Toolbox XML (Scratch colors) -->
    <xml id="toolbox" style="display: none">
    <!-- Blockly Toolbox XML (SPIKE colors) -->
    <xml id="toolbox" style="display: none">
        <category name="モーター" colour="#4C97FF">
            <block type="nxt_motor_run"></block>
            <block type="nxt_motor_stop"></block>
        </category>
        <category name="制御" colour="#FFAB19">
            <block type="nxt_wait"></block>
            <block type="controls_repeat_ext">
                <value name="TIMES">
                    <shadow type="math_number"><field name="NUM">3</field></shadow>
                </value>
            </block>
        </category>
        <category name="演算" colour="#59C059">
            <block type="math_number"></block>
        </category>
    </xml>

    <script>
        
        // 1. モーターを回すブロック (SPIKE風の文言と色)
        Blockly.Blocks['nxt_motor_run'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField(new Blockly.FieldDropdown([["A","0"], ["B","1"], ["C","2"], ["すべて","255"]]), "PORT")
                    .appendField("のモーターを")
                    .appendField(new Blockly.FieldNumber(50, -100, 100), "POWER")
                    .appendField("%のスピードで回す");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour("#4C97FF"); 
            }
        };

        // 2. モーターを止めるブロック
        Blockly.Blocks['nxt_motor_stop'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField(new Blockly.FieldDropdown([["A","0"], ["B","1"], ["C","2"], ["すべて","255"]]), "PORT")
                    .appendField("のモーターを止める");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour("#4C97FF");
            }
        };

        // 3. 待機ブロック (Scratch風オレンジ)
        Blockly.Blocks['nxt_wait'] = {
            init: function() {
                this.appendValueInput("SECONDS")
                    .setCheck("Number")
                    .appendField("待つ (秒)");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour("#FFAB19");
            }
        };

        
        // --- JavaScript Generator (テザー動作用) ---
        const blocklyJs = Blockly.JavaScript;
        blocklyJs.forBlock['nxt_motor_run'] = function(block) {
            let port = block.getFieldValue('PORT');
            let power = block.getFieldValue('POWER');
            return `await nxt.motorRun(${port}, ${power});\n`;
        };
        blocklyJs.forBlock['nxt_motor_stop'] = function(block) {
            let port = block.getFieldValue('PORT');
            return `await nxt.motorStop(${port});\n`;
        };
        blocklyJs.forBlock['nxt_wait'] = function(block, generator) {
            let seconds = generator.valueToCode(block, 'SECONDS', blocklyJs.ORDER_ATOMIC) || '1';
            return `await nxt.wait(${seconds} * 1000);\n`;
        };

        // --- Python Generator (参考表示用) ---
        const blocklyPy = Blockly.Python;
        blocklyPy.forBlock['nxt_motor_run'] = function(block) {
            let portStr = block.getFieldValue('PORT');
            let portMap = {"0": "PORT_A", "1": "PORT_B", "2": "PORT_C", "255": "PORT_ALL"};
            return `motor.run(${portMap[portStr]}, power=${block.getFieldValue('POWER')})\n`;
        };
        blocklyPy.forBlock['nxt_motor_stop'] = function(block) {
            let portStr = block.getFieldValue('PORT');
            let portMap = {"0": "PORT_A", "1": "PORT_B", "2": "PORT_C", "255": "PORT_ALL"};
            return `motor.stop(${portMap[portStr]})\n`;
        };
        blocklyPy.forBlock['nxt_wait'] = function(block, generator) {
            let seconds = generator.valueToCode(block, 'SECONDS', blocklyPy.ORDER_ATOMIC) || '1';
            return `time.sleep(${seconds})\n`;
        };

        // --- C/NXC Generator (本体書き込み・単体動作用) ---
        // Blockly標準にC言語はないため、カスタムジェネレータを定義します
        const blocklyC = new Blockly.Generator('C');
        blocklyC.forBlock['nxt_motor_run'] = function(block) {
            let portStr = block.getFieldValue('PORT');
            let portMap = {"0": "OUT_A", "1": "OUT_B", "2": "OUT_C", "255": "OUT_ABC"};
            let power = block.getFieldValue('POWER');
            return `OnFwd(${portMap[portStr]}, ${power});\n`;
        };
        blocklyC.forBlock['nxt_motor_stop'] = function(block) {
            let portStr = block.getFieldValue('PORT');
            let portMap = {"0": "OUT_A", "1": "OUT_B", "2": "OUT_C", "255": "OUT_ABC"};
            return `Off(${portMap[portStr]});\n`;
        };
        blocklyC.forBlock['nxt_wait'] = function(block, generator) {
            let seconds = generator.valueToCode(block, 'SECONDS', Blockly.Generator.ORDER_ATOMIC) || '1';
            return `Wait(${seconds} * 1000);\n`;
        };
        blocklyC.forBlock['math_number'] = function(block) {
            return [String(block.getFieldValue('NUM')), Blockly.Generator.ORDER_ATOMIC];
        };
        blocklyC.forBlock['controls_repeat_ext'] = function(block, generator) {
            let repeats = generator.valueToCode(block, 'TIMES', Blockly.Generator.ORDER_ATOMIC) || '0';
            let branch = generator.statementToCode(block, 'DO');
            return `repeat(${repeats}) {\n${branch}}\n`;
        };
        blocklyC.scrub_ = function(block, code, opt_thisOnly) {
            const nextBlock = block.nextConnection && block.nextConnection.targetBlock();
            const nextCode = opt_thisOnly ? '' : blocklyC.blockToCode(nextBlock);
            return code + nextCode;
        };

        class NXTController {
            constructor() {
                this.device = null;
                this.connected = false;
                this.logConsole = document.getElementById('logConsole');
            }

            log(msg) {
                const time = new Date().toLocaleTimeString();
                this.logConsole.textContent += `[${time}] ${msg}\n`;
                this.logConsole.scrollTop = this.logConsole.scrollHeight;
            }

            async connect() {
                try {
                    this.device = await navigator.usb.requestDevice({
                        filters: [{ vendorId: 0x0694, productId: 0x0002 }] // LEGO NXT
                    });
                    
                    await this.device.open();
                    if (this.device.configuration === null) await this.device.selectConfiguration(1);
                    await this.device.claimInterface(0);
                    
                    this.connected = true;
                    this.log("WebUSB 接続成功！");
                    this.readLoop();
                    return true;
                } catch (e) {
                    this.log(`接続エラー: ${e.message}`);
                    return false;
                }
            }

            async sendPacket(payload) {
                if (!this.connected || !this.device) return;
                try {
                    // USB通信のため直接転送 (エンドポイント1)
                    await this.device.transferOut(1, payload);
                } catch (e) {
                    this.log(`送信エラー: ${e.message}`);
                }
            }

            async readLoop() {
                try {
                    while (this.connected && this.device) {
                        const result = await this.device.transferIn(2, 64);
                        // センサー応答解析などをここに実装
                    }
                } catch (e) {}
            }

            async motorRun(portNum, power) {
                this.log(`Command: モーター${portNum} Power:${power}`);
                const payload = new Uint8Array([0x80, 0x04, portNum, power, 0x01, 0x01, 0x00, 0x20, 0x00, 0x00, 0x00, 0x00]);
                await this.sendPacket(payload);
            }

            async motorStop(portNum) {
                this.log(`Command: モーター${portNum} 停止`);
                const payload = new Uint8Array([0x80, 0x04, portNum, 0, 0x01, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]);
                await this.sendPacket(payload);
            }

            async wait(ms) {
                this.log(`待機: ${ms}ms`);
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // 新規追加：Renderサーバーにコンパイルを依頼する関数
            async compileOnCloud(nxcCode) {
                this.log("☁️ Renderサーバーへコンパイルを要求中...");
                try {
                    // ※ ここはあなたが作成するRenderのURLに置き換えます
                    const response = await fetch('https://your-render-app.onrender.com/compile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: nxcCode })
                    });
                    
                    if (!response.ok) throw new Error("コンパイル失敗");
                    
                    // バイナリデータ(ArrayBuffer)として受け取る
                    const arrayBuffer = await response.arrayBuffer();
                    return new Uint8Array(arrayBuffer);
                } catch (e) {
                    this.log(`❌ クラウドコンパイルエラー: ${e.message}`);
                    return null;
                }
            }

            // NXTへバイナリファイルを転送する関数（System Commands）
            async uploadBinary(fileName, binaryData) {
                if (!this.connected || !this.device) return false;
                
                this.log(`📦 ファイル ${fileName} (${binaryData.length} bytes) の転送開始...`);

                // 1. OPEN WRITE コマンド作成
                let openCmd = new Uint8Array(26);
                openCmd[0] = 0x01; // System command, reply required
                openCmd[1] = 0x81; // OPEN WRITE
                // ファイル名 (ASCII)
                for (let i = 0; i < fileName.length; i++) openCmd[2 + i] = fileName.charCodeAt(i);
                openCmd[21] = binaryData.length & 0xFF;         // File size (Little Endian)
                openCmd[22] = (binaryData.length >> 8) & 0xFF;
                openCmd[23] = (binaryData.length >> 16) & 0xFF;
                openCmd[24] = (binaryData.length >> 24) & 0xFF;

                await this.sendPacket(openCmd);
                // ⚠️ 本来はここでNXTからの返答(Reply)を読み取り、Handle(ハンドル番号)を取得します。
                // 今回はモックとしてHandleを0x00と仮定して進めます。
                let handle = 0x00; 
                await this.wait(100);

                // 2. WRITE コマンド (分割送信)
                const chunkSize = 32; // NXTのバッファに合わせ小分けに
                for (let offset = 0; offset < binaryData.length; offset += chunkSize) {
                    let chunk = binaryData.slice(offset, offset + chunkSize);
                    let writeCmd = new Uint8Array(3 + chunk.length);
                    writeCmd[0] = 0x01; // System command, reply required
                    writeCmd[1] = 0x84; // WRITE
                    writeCmd[2] = handle; // Handle
                    writeCmd.set(chunk, 3);
                    
                    await this.sendPacket(writeCmd);
                    await this.wait(50); // 送信ごとに少し待つ（NXTの処理落ち防止）
                }

                // 3. CLOSE コマンド
                let closeCmd = new Uint8Array([0x01, 0x85, handle]);
                await this.sendPacket(closeCmd);
                this.log(`✅ 転送完了`);
                await this.wait(100);
                return true;
            }

            // デプロイ処理全体を書き換え
            async deployProgram(nxcCode) {
                this.log("=== デプロイ開始 ===");
                
                // 1. Renderサーバーでバイナリ(RXE)化
                // ⚠️現在はUIテスト用のため、ダミーのバイナリ配列を作成します。
                // 実際は: const binary = await this.compileOnCloud(nxcCode);
                this.log("※デモ用: ダミーバイナリを生成します");
                const binary = new Uint8Array(128).fill(0x00); 
                
                if (!binary) return;

                // 2. 転送実行
                const fileName = "test.rxe";
                await this.uploadBinary(fileName, binary);

                // 3. START PROGRAMコマンド送信
                this.log(`▶ プログラム [${fileName}] 起動指令`);
                let startCmd = new Uint8Array(22);
                startCmd[0] = 0x00; // System command, no reply
                startCmd[1] = 0x00; // START PROGRAM
                for (let i = 0; i < fileName.length; i++) startCmd[2 + i] = fileName.charCodeAt(i);
                
                await this.sendPacket(startCmd);
                this.log("=== デプロイ成功 ===");
            }
            
            async pollSensors() {
                if (!this.connected) {
                    for(let i=1; i<=4; i++) document.getElementById(`sens${i}`).innerText = Math.floor(Math.random() * 100);
                    return;
                }
                const payload = new Uint8Array([0x00, 0x07, 0x00]); // 例: ポート1
                await this.sendPacket(payload);
            }
        }

        let workspace;
        const nxt = new NXTController();
        let pollingInterval = null;

        window.onload = function() {
            // Blocklyの初期化 (Scratch/SPIKE風の Zelos レンダラーを指定)
            workspace = Blockly.inject('blocklyDiv', {
                toolbox: document.getElementById('toolbox'),
                renderer: 'zelos',
                zoom: { controls: true, wheel: true }
            });

            // 初期ブロック
            Blockly.Xml.domToWorkspace(
                Blockly.utils.xml.textToDom(
                    `<xml><block type="nxt_motor_run" x="30" y="30"><field name="PORT">0</field><field name="POWER">75</field></block></xml>`
                ), workspace
            );

            // ブロックが変更されるたびにプレビューコードを更新
            workspace.addChangeListener(updateCodePreview);
            document.getElementById('langSelect').addEventListener('change', updateCodePreview);
            updateCodePreview();
            
            window.addEventListener('resize', () => Blockly.svgResize(workspace), false);
        };

        // リアルタイムコード生成のハンドリング
        function updateCodePreview() {
            const lang = document.getElementById('langSelect').value;
            let code = "";
            if (lang === "js") {
                code = blocklyJs.workspaceToCode(workspace);
            } else if (lang === "py") {
                code = "import nxt_library\n\n" + blocklyPy.workspaceToCode(workspace);
            } else if (lang === "c") {
                code = "task main() {\n" + blocklyC.workspaceToCode(workspace).split('\n').map(l => l ? '  '+l : '').join('\n') + "\n}";
            }
            // textareaのvalueを更新
            document.getElementById('codePreview').value = code || "ブロックがありません";
        }

        // --- ボタンイベント ---
        document.getElementById('btnConnect').addEventListener('click', async () => {
            const success = await nxt.connect();
            if (success) {
                const status = document.getElementById('connectionStatus');
                status.textContent = "USB 接続済み";
                status.className = "ml-4 px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700 shadow-sm border border-green-300";
            }
        });

        document.getElementById('btnTest').addEventListener('click', async () => {
            nxt.log("--- テザー実行開始 ---");
            const code = blocklyJs.workspaceToCode(workspace);
            const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
            try {
                const executor = new AsyncFunction('nxt', code);
                await executor(nxt);
                nxt.log("--- 完了 ---");
            } catch (e) { nxt.log(`エラー: ${e}`); }
        });

        document.getElementById('btnStop').addEventListener('click', async () => {
            nxt.log("!!! 強制停止 !!!");
            await nxt.motorStop(255); 
        });

        document.getElementById('btnDeploy').addEventListener('click', () => {
            const code = "task main() {\n" + blocklyC.workspaceToCode(workspace) + "\n}";
            nxt.deployProgram(code);
        });

        document.getElementById('btnPoll').addEventListener('click', (e) => {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
                e.target.textContent = "監視開始";
                e.target.classList.replace('bg-red-100', 'bg-blue-100');
                e.target.classList.replace('text-red-700', 'text-blue-700');
            } else {
                pollingInterval = setInterval(() => nxt.pollSensors(), 500);
                e.target.textContent = "監視停止";
                e.target.classList.replace('bg-blue-100', 'bg-red-100');
                e.target.classList.replace('text-blue-700', 'text-red-700');
            }
        });
    </script>
</body>
</html>
